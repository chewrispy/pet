<style>
  @font-face {
    font-family: 'Galmuri11';
    src: url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/Galmuri11.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'Galmuri11';
    font-weight: bold;
    src: url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/Galmuri11-Bold.woff2') format('woff2');
    font-display: swap;
  }
  :root {
    --sky:   #FDEEDC;   /* 복숭아빛 하늘 */
    --grass: #60A848;   /* 스프라이트와 같은 잔디색 */
    --grass-deep: #3E7A32;
    --ink:   #36261A;   /* 스프라이트 외곽선색 */
    --coat:  #C4714E;   /* 말 털색 */
    --paper: #FFFAF0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Galmuri11', 'DotGothic16', monospace;
    background: var(--sky);
    color: var(--ink);
    overflow: hidden;
  }
  .px { image-rendering: pixelated; }

  /* ---------- 상단 콘텐츠 ---------- */
  .stage-copy {
    position: relative;
    z-index: 2;
    max-width: 640px;
    margin: 0 auto;
    padding: clamp(40px, 12vh, 110px) 24px 0;
    text-align: center;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 18px;
  }
  h1 {
    font-weight: bold;
    font-size: clamp(30px, 6vw, 46px);
    line-height: 1.2;
    margin-bottom: 14px;
  }
  .lede {
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 28px;
  }
  .btn-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
  .btn {
    display: inline-block;
    font-family: inherit;
    font-weight: bold;
    font-size: 14px;
    text-decoration: none;
    padding: 12px 18px;
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    background: var(--coat);
    color: #fff;
    transition: transform .05s, box-shadow .05s;
  }
  .btn.ghost { background: var(--paper); color: var(--ink); }
  .btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  .btn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  .hint { font-size: 12px; line-height: 2; opacity: .75; }
  .hint b { font-weight: bold; }

  /* ---------- 하늘 ---------- */
  .cloud { position: absolute; z-index: 1; opacity: .9; }
  #cloud1 { width: 120px; top: 12%;  animation: drift 90s linear infinite; }
  #cloud2 { width: 80px;  top: 30%;  animation: drift 140s linear infinite; animation-delay: -60s; }
  @keyframes drift {
    from { left: -140px; }
    to   { left: 100%; }
  }

  /* ---------- 잔디 무대 ---------- */
  .pasture {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 52px;
    background: var(--grass);
    border-top: 4px solid var(--grass-deep);
    z-index: 3;
  }
  .pasture::before {   /* 잔디 결 */
    content: '';
    position: absolute;
    top: -10px; left: 0; right: 0; height: 6px;
    background:
      repeating-linear-gradient(90deg,
        transparent 0 14px, var(--grass) 14px 18px,
        transparent 18px 34px, var(--grass-deep) 34px 38px, transparent 38px 52px);
  }

  /* ---------- 말 ---------- */
  #horse {
    position: fixed;
    z-index: 5;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #horse img { display: block; width: 144px; height: 104px; }
  #bubble {
    position: absolute;
    left: 50%;
    top: -34px;
    transform: translateX(-50%);
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 5px 10px;
    font-size: 13px;
    white-space: nowrap;
    visibility: hidden;
  }
  #bubble .heart { color: crimson; }
  .pile {
    position: fixed;
    z-index: 4;
    width: 40px; height: 25px;
    cursor: pointer;
    transition: opacity .4s;
  }
  footer {
    position: fixed;
    z-index: 2;
    left: 0; right: 0; bottom: 60px;
    text-align: center;
    font-size: 11px;
    opacity: .55;
  }
  @media (max-width: 520px) {
    #horse img { width: 108px; height: 78px; }
    footer { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud { animation: none !important; left: 10%; }
  }

const SRC = {};
for (const k in B64) SRC[k] = 'data:image/png;base64,' + B64[k];
const runCycle = ['run1', 'run2', 'run3', 'run2'];

// ---------- 요소 ----------
const horseEl = document.getElementById('horse');
const horseImg = document.getElementById('horse-img');
const bubble = document.getElementById('bubble');
const bubbleText = document.getElementById('bubble-text');
const bubbleHeart = document.getElementById('bubble-heart');

// ---------- 상태 (PowerShell판 상태 머신 이식) ----------
const TICK_MS = 30;
const GRASS_H = 52;
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = () => horseImg.clientWidth || 144;
let maxX = () => window.innerWidth - W();
let groundY = () => window.innerHeight - GRASS_H - (horseImg.clientHeight || 104) + 8; // 발굽이 잔디에 살짝 묻히게

let x = Math.max(0, (window.innerWidth - 144) / 2);
let dir = -1;
let targetX = Math.max(0, x - 400);
let state = reduced ? 'idle' : 'run';
let stateTicks = reduced ? 1e9 : 150;
let jumpTicks = 0, bubbleTicks = 0, tick = 0;
let piles = [];

function setBubble(text, heart, ticks) {
  bubbleText.textContent = text;
  bubbleHeart.textContent = heart ? ' \u2665' : '';
  bubble.style.visibility = 'visible';
  bubbleTicks = ticks;
}

function dropPile(px) {
  const el = document.createElement('img');
  el.className = 'pile px';
  el.src = SRC.pile;
  el.title = '클릭해서 치우기';
  el.style.left = Math.min(Math.max(px, 0), window.innerWidth - 40) + 'px';
  el.style.top = (window.innerHeight - GRASS_H - 14) + 'px';
  el.addEventListener('click', () => el.remove());
  document.body.appendChild(el);
  piles.push({ el, ttl: 700 });
  if (piles.length > 4) { const old = piles.shift(); old.el.remove(); }
}

function transition() {
  const toPoop = (state === 'graze' && Math.random() < 0.35) || Math.random() >= 0.87;
  if (toPoop && !reduced) {
    state = 'poop'; stateTicks = 80;
    setBubble('뿌지직...', false, 80);
  } else {
    const r = Math.random();
    if (r < 0.42 && !reduced) {
      state = 'run';
      targetX = Math.random() * maxX();
      dir = targetX > x ? 1 : -1;
      stateTicks = 2000;
    } else if (r < 0.62) {
      state = 'idle'; stateTicks = 60 + Math.floor(Math.random() * 120);
    } else {
      state = 'graze'; stateTicks = 160 + Math.floor(Math.random() * 160);
    }
  }
}

function loop() {
  tick++;
  const gY = groundY();

  if (jumpTicks > 0) {
    jumpTicks--;
    const p = 1 - jumpTicks / 16;
    horseEl.style.top = (gY - 60 * Math.sin(Math.PI * p)) + 'px';
    horseImg.src = SRC.run1;
  } else {
    stateTicks--;
    if (stateTicks <= 0) transition();

    if (state === 'run') {
      x += 3.4 * dir;
      if (x < 0) { x = 0; dir = 1; }
      if (x > maxX()) { x = maxX(); dir = -1; }
      if (Math.abs(x - targetX) < 6) stateTicks = 1;
      horseEl.style.left = x + 'px';
      horseEl.style.top = gY + 'px';
      horseImg.src = SRC[runCycle[Math.floor(tick / 3) % 4]];
      horseImg.style.transform = dir > 0 ? 'scaleX(-1)' : '';
    } else if (state === 'idle') {
      horseEl.style.top = gY + 'px';
      horseImg.src = (tick % 45 < 8) ? SRC.standB : SRC.standA;
      if (bubbleTicks <= 0 && Math.random() < 0.006) setBubble('히히힝~!', false, 45);
    } else if (state === 'graze') {
      horseEl.style.top = gY + 'px';
      horseImg.src = (tick % 16 < 8) ? SRC.grazeA : SRC.grazeB;
    } else if (state === 'poop') {
      horseEl.style.top = gY + 'px';
      horseImg.src = stateTicks > 40 ? SRC.poopA : SRC.poopB;
      if (stateTicks <= 1) {
        const flipped = horseImg.style.transform !== '';
        dropPile(flipped ? x + 2 : x + W() - 42);
        dir = -dir;
        targetX = dir > 0 ? maxX() : 0;
        state = 'run'; stateTicks = 2000;
      }
    }
  }

  // 응가 수명 관리
  for (let i = piles.length - 1; i >= 0; i--) {
    const p = piles[i];
    p.ttl--;
    if (p.ttl <= 0 || !p.el.isConnected) { p.el.remove(); piles.splice(i, 1); }
    else if (p.ttl < 60) p.el.style.opacity = p.ttl / 60;
  }

  // 말풍선 타이머
  if (bubbleTicks > 0 && --bubbleTicks === 0) bubble.style.visibility = 'hidden';
}

horseEl.addEventListener('click', () => {
  if (jumpTicks <= 0 && state !== 'poop') jumpTicks = 16;
  if (state !== 'poop') setBubble('히힝~', true, 35);
});

window.addEventListener('resize', () => { x = Math.min(x, maxX()); });

// 시작
horseImg.src = SRC.standA;
horseImg.onload = () => {
  horseEl.style.left = x + 'px';
  horseEl.style.top = groundY() + 'px';
};
setInterval(loop, TICK_MS);
</script>
</body>
</html>
